<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#25282b"><link rel="manifest" href="/static/manifest.json"><link rel="stylesheet" href="/static/style.css?v=3"><title>Homestead Work Planner</title></head><body><header><div class="brand"><img id="brandLogo" src="/static/homestead-logo.png" alt="Homestead — Simple. Control." hidden><div id="brandFallback" class="brand-fallback">Homestead<small>Simple. Control.</small></div></div><div class="header-title"><h1>WORK PLANNER</h1><small>HOMESTEAD SMART SOLUTIONS</small></div></header><p id="notice" role="status"></p><section id="login"><form id="loginForm"><h2>Sign in</h2><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><main id="app" hidden><nav><button id="calendarTab">Calendar</button><button id="add">+ Add task</button><button id="backlog">Unscheduled</button><button id="logout">Sign out</button></nav><section id="calendar"><div class="toolbar"><button id="prev">‹</button><h2 id="month"></h2><button id="next">›</button><button id="today">Today</button><button id="view">Week</button></div><div id="grid"></div><p class="legend">Red: conflict or over 10h · Amber: 8–10h · Purple: holiday</p><h3 id="dayTitle"></h3><div id="dayTasks"></div><h3>Next four weeks</h3><div id="summary"></div><label>Search jobs<input id="search" placeholder="Name, customer or location"></label><div id="results"></div><a href="/api/export">Export CSV</a></section><section id="editor" hidden><form id="taskForm"><h2 id="editorTitle">New task</h2><label>Task name<input name="name" required maxlength="200"></label><label>Details<textarea name="detail"></textarea></label><label>Customer<input name="customer"></label><label>Location<input name="location"></label><label>Date (optional for unscheduled work)<input name="day" type="date"></label><label>Scheduling method<select id="mode"><option value="hours">Expected hours</option><option value="timed">Start and finish</option></select></label><label id="hoursLabel">Expected hours<input name="hours" type="number" min="0.016" max="24" step="any" value="1"></label><div id="times" hidden><label>Start<input name="start" type="time"></label><label>Finish<input name="finish" type="time"></label></div><label>Travel hours<input name="travel" type="number" min="0" max="24" step="any" value="0"></label><label>Comments<textarea name="comments"></textarea></label><label>Status<select name="status"><option>Planned</option><option>In progress</option><option>Completed</option><option>Postponed</option></select></label><label>Priority<select name="priority"><option>Normal</option><option>High</option><option>Urgent</option></select></label><button id="submit">Submit task</button><button type="button" id="duplicate" hidden>Duplicate</button><button type="button" id="delete" hidden>Delete task</button><button type="button" id="cancel">Cancel</button></form></section></main><script src="/static/app.js?v=3" defer></script></body></html>
